<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1c1917" />
      <stop offset="100%" stop-color="#000000" />
    </radialGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded canvas -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" stroke="#f59e0b" stroke-width="6" stroke-opacity="0.3" />

  <!-- Outer Islamic 8-Point Star Border -->
  <g transform="translate(256, 256) scale(0.85)" opacity="0.18">
    <rect x="-160" y="-160" width="320" height="320" fill="none" stroke="#f59e0b" stroke-width="4" rx="24" />
    <rect x="-160" y="-160" width="320" height="320" fill="none" stroke="#f59e0b" stroke-width="4" rx="24" transform="rotate(45)" />
  </g>

  <!-- Islamic Holy Quran Book Symbol -->
  <g transform="translate(256, 246)" filter="url(#goldGlow)">
    <!-- Book Stand / Rihal & Open Quran Spine -->
    <path d="M-130 50 C-70 10 -20 20 0 45 C20 20 70 10 130 50 C140 54 140 70 130 75 C70 40 20 50 0 75 C-20 50 -70 40 -130 75 C-140 70 -140 54 -130 50 Z" fill="url(#goldGrad)" />
    
    <!-- Left Quran Page -->
    <path d="M-130 -60 C-60 -95 -15 -80 0 -50 L0 45 C-20 20 -70 10 -130 50 Z" fill="url(#goldGrad)" opacity="0.95" />
    
    <!-- Right Quran Page -->
    <path d="M130 -60 C60 -95 15 -80 0 -50 L0 45 C20 20 70 10 130 50 Z" fill="url(#goldGrad)" />
    
    <!-- Page decorative inner lines -->
    <path d="M-105 -40 C-60 -65 -25 -55 -15 -35" fill="none" stroke="#000000" stroke-width="3" stroke-linecap="round" opacity="0.6" />
    <path d="M-105 -15 C-60 -40 -25 -30 -15 -10" fill="none" stroke="#000000" stroke-width="3" stroke-linecap="round" opacity="0.6" />
    <path d="M-105 10 C-60 -15 -25 -5 -15 15" fill="none" stroke="#000000" stroke-width="3" stroke-linecap="round" opacity="0.6" />

    <path d="M105 -40 C60 -65 25 -55 15 -35" fill="none" stroke="#000000" stroke-width="3" stroke-linecap="round" opacity="0.6" />
    <path d="M105 -15 C60 -40 25 -30 15 -10" fill="none" stroke="#000000" stroke-width="3" stroke-linecap="round" opacity="0.6" />
    <path d="M105 10 C60 -15 25 -5 15 15" fill="none" stroke="#000000" stroke-width="3" stroke-linecap="round" opacity="0.6" />

    <!-- Radiant Islamic Sun / Crescent at Top Center -->
    <circle cx="0" cy="-115" r="24" fill="url(#goldGrad)" />
    <circle cx="6" cy="-119" r="20" fill="#0c0a09" />
    <circle cx="-1" cy="-115" r="5" fill="url(#goldGrad)" />

    <!-- Rays -->
    <path d="M-40 -125 L-28 -120 M40 -125 L28 -120 M0 -150 L0 -140 M-30 -100 L-22 -105 M30 -100 L22 -105" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round" />
  </g>

  <!-- App Title Typography in Arabic -->
  <text x="256" y="420" font-family="'Scheherazade New', 'Amiri', serif" font-size="44" font-weight="bold" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="2">
    مَوْقِع التَّوْبَة
  </text>
  <text x="256" y="458" font-family="'Cairo', sans-serif" font-size="18" font-weight="600" fill="#a8a29e" text-anchor="middle">
    الْقُرْآنُ الْكَرِيم
  </text>
</svg>
